# ==============================================================================
# Brand Bridge - Continuous Integration & Production Quality Gate
# ==============================================================================

name: CI & Production Readiness

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Frontend Verification Pipeline
  # ----------------------------------------------------------------------------
  frontend-pipeline:
    name: Frontend Quality & Build Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run type-check

      - name: Execute Vitest Suite
        run: npm run test

      - name: Verify Production Bundle Compilation
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Validate Output Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -d dist/assets || { echo "Missing dist/assets directory"; exit 1; }
          echo "Frontend distribution bundle verified successfully."

  # ----------------------------------------------------------------------------
  # Job 2: Backend Verification Pipeline
  # ----------------------------------------------------------------------------
  backend-pipeline:
    name: Backend Pytest & Migrations Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Runtime (v3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic Database Migrations
        run: |
          export DATABASE_URL="sqlite+aiosqlite:///./ci_test_migration.db"
          alembic upgrade head
          alembic current
          rm -f ./ci_test_migration.db
        env:
          ENVIRONMENT: testing

      - name: Execute Pytest Suite (Unit, Integration & Security)
        run: pytest -v --tb=short
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: ci-test-secret-key-32-character-length-test

  # ----------------------------------------------------------------------------
  # Job 3: Docker Container Build Verification
  # ----------------------------------------------------------------------------
  container-build-verification:
    name: Docker Containerization Build Gate
    runs-on: ubuntu-latest
    needs: [frontend-pipeline, backend-pipeline]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: brand-bridge-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: brand-bridge-frontend:ci
          build-args: |
            VITE_API_URL=/api
