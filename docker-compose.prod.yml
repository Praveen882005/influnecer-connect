# ==============================================================================
# Brand Bridge - Production Docker Compose Orchestration
# ==============================================================================
# Architecture:
#   - Postgres 16 Alpine: Relational Database with persistent volume
#   - FastAPI Backend: Python 3.12 slim, Uvicorn multi-worker, auto-migrations
#   - Frontend Web App: Nginx Alpine, SPA routing, reverse-proxying /api
# ==============================================================================

name: brand-bridge-production

services:
  # ----------------------------------------------------------------------------
  # Database Service (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: brand_bridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-brand_bridge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brand_bridge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brand_bridge_net

  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI / Uvicorn)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brand_bridge_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-brand_bridge}
      SECRET_KEY: ${SECRET_KEY:-ensure_to_generate_a_secure_random_key_in_production_32chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80}
      PORT: 8000
      WEB_CONCURRENCY: 2
    volumes:
      - backend_data:/app/data/samples
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - brand_bridge_net

  # ----------------------------------------------------------------------------
  # Frontend Static Web Server & API Reverse Proxy (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: brand_bridge_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - brand_bridge_net

volumes:
  postgres_data:
    name: brand_bridge_postgres_data
  backend_data:
    name: brand_bridge_backend_data

networks:
  brand_bridge_net:
    driver: bridge
